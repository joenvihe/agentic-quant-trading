[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quant-trading"
version = "0.1.0"
description = "Educational quantitative research project for swing trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmmlearn>=0.3.2",
    "scipy>=1.11",
    "vaderSentiment>=3.3.2",
    "xgboost>=2.1",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "application*",
    "app*",
    "backtest*",
    "config*",
    "data*",
    "evaluation*",
    "factors*",
    "features*",
    "experiments*",
    "fundamental*",
    "models*",
    "portfolio*",
    "regime*",
    "reporting*",
    "risk*",
    "sentiment*",
    "signals*",
    "scripts*",
    "strategies*",
    "universe*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
